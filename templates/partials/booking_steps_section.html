<section id="how-it-works" class="border-b border-borderline bg-[#F2F1EC]">
    <div class="max-w-[1320px] mx-auto">
        <div class="grid grid-cols-1 lg:grid-cols-12 items-stretch">

            <!-- Dark Panel CTA (Right side in RTL desktop layout matching reference bottom-right dark box) -->
            <div class="lg:col-span-4 bg-darkpanel text-white p-8 sm:p-10 flex flex-col justify-center relative overflow-hidden">
                <div class="relative z-10 space-y-3">
                    <h2 class="text-xl sm:text-2xl font-bold leading-snug">
                        {{ site_config.cta_banner_title }}
                    </h2>
                    <p class="text-xs sm:text-sm text-gray-200 leading-relaxed max-w-sm">
                        {{ site_config.cta_banner_subtitle }}
                    </p>
                    <div class="pt-2">
                        <a href="#spaces-section"
                           class="inline-flex items-center gap-2 border border-white/60 hover:bg-white hover:text-primarytext text-white text-xs sm:text-sm font-medium px-4 py-2 rounded-[6px] transition duration-150">
                            <span>استعرض الوحدات</span>
                            <i data-lucide="arrow-left" class="w-3.5 h-3.5" aria-hidden="true"></i>
                        </a>
                    </div>
                </div>
            </div>

            <!-- 3 Booking Steps Horizontal Area -->
            <div class="lg:col-span-8 p-8 sm:p-10 flex flex-col justify-center">
                <div class="mb-7 text-right">
                    <h2 class="text-xl sm:text-2xl font-bold text-primarytext mb-1">كيف يعمل النظام؟</h2>
                    <p class="text-xs sm:text-sm text-secondarytext">بضع خطوات بسيطة لحجز مساحتك</p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 divide-y sm:divide-y-0 sm:divide-x sm:divide-x-reverse divide-borderline">

                    <!-- Step 1 -->
                    <div class="pt-4 sm:pt-0 sm:px-4 first:pr-0 flex items-start gap-3.5">
                        <div class="w-10 h-10 rounded-[6px] bg-iconbg text-petrol flex items-center justify-center shrink-0 mt-1">
                            <i data-lucide="search" class="w-5 h-5" aria-hidden="true"></i>
                        </div>
                        <div>
                            <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-cardbg border border-borderline text-[11px] font-bold text-primarytext mb-1">1</span>
                            <h3 class="text-sm font-bold text-primarytext mb-1">اختر الوحدة المناسبة</h3>
                            <p class="text-xs text-secondarytext leading-relaxed">تصفح وحداتنا المتاحة</p>
                        </div>
                    </div>

                    <!-- Step 2 -->
                    <div class="pt-4 sm:pt-0 sm:px-4 flex items-start gap-3.5">
                        <div class="w-10 h-10 rounded-[6px] bg-iconbg text-petrol flex items-center justify-center shrink-0 mt-1">
                            <i data-lucide="calendar" class="w-5 h-5" aria-hidden="true"></i>
                        </div>
                        <div>
                            <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-cardbg border border-borderline text-[11px] font-bold text-primarytext mb-1">2</span>
                            <h3 class="text-sm font-bold text-primarytext mb-1">حدد التاريخ والوقت</h3>
                            <p class="text-xs text-secondarytext leading-relaxed">مع إضافة الخدمات الإضافية</p>
                        </div>
                    </div>

                    <!-- Step 3 -->
                    <div class="pt-4 sm:pt-0 sm:px-4 flex items-start gap-3.5">
                        <div class="w-10 h-10 rounded-[6px] bg-iconbg text-petrol flex items-center justify-center shrink-0 mt-1">
                            <i data-lucide="credit-card" class="w-5 h-5" aria-hidden="true"></i>
                        </div>
                        <div>
                            <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-cardbg border border-borderline text-[11px] font-bold text-primarytext mb-1">3</span>
                            <h3 class="text-sm font-bold text-primarytext mb-1">ادفع وأكد الحجز</h3>
                            <p class="text-xs text-secondarytext leading-relaxed">احصل على تأكيد فوري عبر البريد</p>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>
</section>
